name: CI/CD Pipeline — Smart Civic Platform

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Test Suite & Mongoose Persistence
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: cd server && npm ci

      - name: Run Master Database Bootstrap Seeder
        run: cd server && node scripts/seed_database_master.js
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/smart-civic
          JWT_SECRET: test_secret_key_12345678901234567890

      - name: Run Database Persistence Tests
        run: cd server && node scripts/test_complete_db_persistence.js
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/smart-civic
          JWT_SECRET: test_secret_key_12345678901234567890

      - name: Run Final Enterprise Capabilities Suite
        run: cd server && node scripts/test_final_enterprise_capabilities.js
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/smart-civic

  frontend-build:
    name: Frontend TypeScript Validation & Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Run TypeScript Compiler & Vite Production Build
        run: cd frontend && npm run build

  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: smart-civic-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: smart-civic-frontend:test
