<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="scGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="scAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Precision Rounded Squircle Container -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="#022c22" />
  <rect x="2" y="2" width="96" height="96" rx="26" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Geometric Minimalist "SC" Civic Keystone Mark -->
  <g transform="translate(18, 18)">
    <!-- Top Geometric Arch (S-Head & Urban Canopy) -->
    <path
      d="M 12 28 
         C 12 14, 22 8, 38 8 
         C 52 8, 60 16, 60 26 
         C 60 38, 46 42, 34 46
         C 22 50, 16 56, 16 64
         C 16 76, 26 84, 42 84
         C 56 84, 62 76, 62 66"
      fill="none"
      stroke="url(#scGradient)"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Intersecting Civic Pillar / Core Node -->
    <path
      d="M 38 28
         C 46 28, 48 34, 48 40
         C 48 48, 40 52, 32 54"
      fill="none"
      stroke="url(#scAccent)"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- Focal Data & Governance Point -->
    <circle cx="48" cy="64" r="4.5" fill="#ffffff" />
  </g>
</svg>