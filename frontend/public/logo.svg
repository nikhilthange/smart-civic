<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="scGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="dropShadowLogo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#047857" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Badge -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#scGradLogo)" filter="url(#dropShadowLogo)" />
  <rect x="8" y="8" width="84" height="84" rx="22" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-opacity="0.5" />

  <!-- Geometric Modern Civic Building Structure -->
  <!-- Left Wing -->
  <path d="M22 68 L22 46 L34 38 L34 68 Z" fill="#ffffff" fill-opacity="0.85" />
  <!-- Center Main Tower / Dome Base -->
  <path d="M38 68 L38 28 L50 18 L62 28 L62 68 Z" fill="#ffffff" />
  <!-- Right Wing -->
  <path d="M66 68 L66 38 L78 46 L78 68 Z" fill="#ffffff" fill-opacity="0.85" />

  <!-- Center Portal / Archway -->
  <path d="M44 68 L44 50 Q50 44 56 50 L56 68 Z" fill="#064e3b" />

  <!-- Smart AI Vision Sparkle / Node (Top Star) -->
  <circle cx="50" cy="18" r="4" fill="#facc15" />
  <path d="M50 10 L51.5 16 L57 18 L51.5 20 L50 26 L48.5 20 L43 18 L48.5 16 Z" fill="#fef08a" />

  <!-- Smart IoT Connection Nodes -->
  <circle cx="28" cy="42" r="2.5" fill="#a7f3d0" />
  <circle cx="72" cy="42" r="2.5" fill="#a7f3d0" />
  <path d="M28 42 L50 32 L72 42" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="2,2" fill="none" />
</svg>
