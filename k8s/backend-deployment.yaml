apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-civic-backend
  namespace: smart-civic
  labels:
    app: smart-civic
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smart-civic
      tier: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: smart-civic
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: backend-api
          image: smart-civic/backend:v1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http-api
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/live
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          envFrom:
            - configMapRef:
                name: smart-civic-config
            - secretRef:
                name: smart-civic-secrets
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: smart-civic-backend-service
  namespace: smart-civic
  labels:
    app: smart-civic
    tier: backend
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http-api
  selector:
    app: smart-civic
    tier: backend
