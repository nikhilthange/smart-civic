apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smart-civic-backup-pvc
  namespace: smart-civic
  labels:
    app.kubernetes.io/name: smart-civic-backup-pvc
    app.kubernetes.io/component: database-backup
    app.kubernetes.io/part-of: smart-civic
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: smart-civic-daily-backup
  namespace: smart-civic
  labels:
    app.kubernetes.io/name: smart-civic-backup-cronjob
    app.kubernetes.io/component: database-backup
    app.kubernetes.io/part-of: smart-civic
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: smart-civic-backup-job
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cluster-backup-agent
              image: ghcr.io/nikhilthange/smart-civic-backend:v1.0.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "scripts/backup_cluster_data.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: "150m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              envFrom:
                - configMapRef:
                    name: smart-civic-config
              env:
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: smart-civic-secrets
                      key: MONGO_URI
                - name: REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: smart-civic-secrets
                      key: REDIS_URL
                - name: BACKUP_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: smart-civic-secrets
                      key: JWT_SECRET
              volumeMounts:
                - name: backup-storage
                  mountPath: /var/backups/smart-civic
                - name: tmp-volume
                  mountPath: /tmp
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: smart-civic-backup-pvc
            - name: tmp-volume
              emptyDir: {}
