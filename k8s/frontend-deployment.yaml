apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-civic-frontend
  namespace: smart-civic
  labels:
    app: smart-civic
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-civic
      tier: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: smart-civic
        tier: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: frontend-nginx
          image: smart-civic/frontend:v1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http-web
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: smart-civic-frontend-service
  namespace: smart-civic
  labels:
    app: smart-civic
    tier: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http-web
  selector:
    app: smart-civic
    tier: frontend
