apiVersion: v1
kind: Secret
metadata:
  name: smart-civic-secrets
  namespace: smart-civic
  labels:
    app: smart-civic
    tier: security
type: Opaque
stringData:
  MONGO_URI: "mongodb+srv://<USER>:<PASSWORD>@smart-civic.mongodb.net/smart-civic?retryWrites=true&w=majority"
  JWT_SECRET: "SECURE_EPHEMERAL_JWT_SIGNING_KEY_REPLACE_IN_PROD_VAULT"
  JWT_EXPIRES_IN: "7d"
  PROMETHEUS_BEARER_TOKEN: "MUMBAI_SRE_PROMETHEUS_SECURE_SCRAPE_BEARER_TOKEN"
  CLOUDINARY_CLOUD_NAME: "smart-civic-mumbai"
  CLOUDINARY_API_KEY: "CLOUDINARY_API_KEY_SECURE"
  CLOUDINARY_API_SECRET: "CLOUDINARY_API_SECRET_SECURE"
  WEBHOOK_HMAC_SECRET: "BMC_HMAC_SHA256_WEBHOOK_SECRET_KEY"
  GEMINI_API_KEY: "GOOGLE_GEMINI_AI_PRODUCTION_KEY"
