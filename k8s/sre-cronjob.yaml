apiVersion: batch/v1
kind: CronJob
metadata:
  name: smart-civic-daily-sre-audit
  namespace: smart-civic
  labels:
    app.kubernetes.io/name: smart-civic-sre-audit
    app.kubernetes.io/component: sre-monitoring
    app.kubernetes.io/part-of: smart-civic
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: smart-civic-sre-audit
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sre-health-scanner
              image: smart-civic/backend:v1.0.1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - "node server/scripts/daily_sre_health_check.js && node server/scripts/test_continuous_chaos_gate.js && node server/scripts/test_mission_critical_hardening.js && node server/scripts/test_complete_backend_sweep.js"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: "250m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              envFrom:
                - configMapRef:
                    name: smart-civic-config
              env:
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: smart-civic-secrets
                      key: MONGO_URI
                - name: JWT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: smart-civic-secrets
                      key: JWT_SECRET
                - name: API_URL
                  value: "http://smart-civic-backend-service.smart-civic.svc.cluster.local:5000"
              volumeMounts:
                - name: tmp-volume
                  mountPath: /tmp
          volumes:
            - name: tmp-volume
              emptyDir: {}
