apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-civic-worker
  namespace: smart-civic
  labels:
    app: smart-civic
    tier: background-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-civic
      tier: background-worker
  template:
    metadata:
      labels:
        app: smart-civic
        tier: background-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: smart-civic-backend:v1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - node
            - server/services/backgroundWorker.js
          env:
            - name: NODE_ENV
              value: "production"
            - name: WORKER_MODE
              value: "true"
            - name: PORT
              value: "5050"
          envFrom:
            - configMapRef:
                name: smart-civic-config
            - secretRef:
                name: smart-civic-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
