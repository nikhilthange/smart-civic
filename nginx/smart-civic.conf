# ==============================================================================
# SMART CIVIC: PRODUCTION NGINX REVERSE PROXY & STATIC DELIVERY SPECIFICATION
# Target Release: v1.0.1 | GitOps Baseline Commit: 53d30d1
# Target Path on Server: /etc/nginx/sites-available/smart-civic.conf
# ==============================================================================

# Rate Limiting Zones (DDoS & Brute-Force Mitigation)
limit_req_zone $binary_remote_addr zone=smartcivic_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=smartcivic_auth_limit:10m rate=5r/s;

# Upstream Node.js API Cluster
upstream smartcivic_backend_cluster {
    least_conn;
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# HTTP (Port 80) -> Automatic Canonical HTTPS Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name smartcivic.mumbai.gov.in www.smartcivic.mumbai.gov.in;

    # ACME Let's Encrypt Challenge Location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) -> TLS-Hardened Production Server
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartcivic.mumbai.gov.in;

    # Document Root (Compiled React/Vite SPA)
    root /var/www/smart-civic/frontend/dist;
    index index.html;

    # ─── TLS / SSL Configuration (Mozilla Modern Standard) ───────────────────
    ssl_certificate /etc/letsencrypt/live/smartcivic.mumbai.gov.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartcivic.mumbai.gov.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/smartcivic.mumbai.gov.in/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ─── Production GovTech Security Headers ───────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://images.unsplash.com https://res.cloudinary.com; connect-src 'self' ws: wss: https://*.tile.openstreetmap.org https://api.razorpay.com; frame-src 'self' https://api.razorpay.com;" always;

    # ─── High-Performance Compression directives ─────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ─── Maximum Upload Payload Limit ──────────────────────────────────────────
    client_max_body_size 10M;

    # ─── Static Asset Delivery (Immutable Caching for Rollup Chunks) ───────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static Media / Favicon / Service Worker
    location ~* \.(ico|png|jpg|jpeg|webp|svg|woff2|woff|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # ─── Uncached SRE Telemetry Probes ─────────────────────────────────────────
    location ~ ^/api/(live|health|metrics) {
        proxy_pass http://smartcivic_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable all caching for live SRE telemetry
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    # ─── WebSocket Gateway (Socket.IO Real-Time Stream) ────────────────────────
    location /socket.io/ {
        proxy_pass http://smartcivic_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts to maintain long-lived municipal telemetry streams
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    # ─── Backend REST API Proxy ───────────────────────────────────────────────
    location /api/ {
        limit_req zone=smartcivic_api_limit burst=50 nodelay;

        proxy_pass http://smartcivic_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffer tuning for high-throughput responses
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ─── Uploaded Static Media Storage (Local Fallback) ────────────────────────
    location /uploads/ {
        alias /var/www/smart-civic/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ─── SPA Client-Side Routing Fallback ──────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
